# Atlas AI Platform profile. Every value can be overridden by environment variables; no secret has a default.
spring.application.name=atlas-platform
server.address=${ATLAS_BIND_ADDRESS:127.0.0.1}
server.port=${ATLAS_PORT:18081}
server.error.include-message=never
server.servlet.session.cookie.name=ATLAS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${ATLAS_COOKIE_SECURE:false}
server.servlet.session.timeout=${ATLAS_SESSION_TIMEOUT:12h}
server.tomcat.max-http-form-post-size=256KB
spring.servlet.multipart.max-file-size=${ATLAS_MAX_UPLOAD:50MB}
spring.servlet.multipart.max-request-size=${ATLAS_MAX_UPLOAD:50MB}
spring.autoconfigure.exclude=

spring.datasource.url=${ATLAS_DB_URL:jdbc:postgresql://127.0.0.1:15432/atlas}
spring.datasource.username=${ATLAS_DB_USER:atlas}
spring.datasource.password=${ATLAS_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${ATLAS_DB_POOL:15}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=SPRING_SESSION

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/actuator

atlas.registration.open=${ATLAS_REGISTRATION_OPEN:false}
atlas.bootstrap.admin-email=${ATLAS_BOOTSTRAP_ADMIN_EMAIL:}
atlas.bootstrap.admin-password=${ATLAS_BOOTSTRAP_ADMIN_PASSWORD:}
atlas.bootstrap.org-name=${ATLAS_BOOTSTRAP_ORG_NAME:Atlas}

atlas.storage.type=${ATLAS_STORAGE:s3}
atlas.storage.s3.endpoint=${ATLAS_S3_ENDPOINT:http://127.0.0.1:19000}
atlas.storage.s3.bucket=${ATLAS_S3_BUCKET:atlas-documents}
atlas.storage.s3.access-key=${ATLAS_S3_ACCESS_KEY:}
atlas.storage.s3.secret-key=${ATLAS_S3_SECRET_KEY:}
atlas.storage.filesystem.root=${ATLAS_FILE_ROOT:data/platform-objects}

atlas.models.enabled=${ATLAS_MODELS_ENABLED:true}
atlas.models.embedding-url=${AKA_EMBEDDING_URL:http://127.0.0.1:18112}
atlas.models.reranker-url=${AKA_RERANKER_URL:http://127.0.0.1:18113}
atlas.models.llm-url=${AKA_LLM_URL:http://127.0.0.1:18111}
atlas.models.llm-model=${AKA_LLM_MODEL:qwen3-4b-instruct-2507}
atlas.models.quality-llm-url=${AKA_QUALITY_LLM_URL:}
atlas.models.quality-llm-model=${AKA_QUALITY_LLM_MODEL:qwen3-8b}
atlas.models.max-concurrent-inference=${ATLAS_MAX_INFERENCE:1}
atlas.qdrant.url=${AKA_QDRANT_URL:http://127.0.0.1:16333}
atlas.qdrant.collection=${ATLAS_QDRANT_COLLECTION:atlas_platform_v1}

atlas.rag.candidate-k=${AKA_CANDIDATE_K:10}
atlas.rag.top-k=${ATLAS_TOP_K:5}
atlas.rag.min-rerank-score=${AKA_RERANK_MIN_SCORE:-8.0}
atlas.rag.max-rerank-gap=${AKA_RERANK_MAX_GAP:5.0}
atlas.rag.chunk-max-chars=${ATLAS_CHUNK_MAX_CHARS:800}

atlas.jobs.workers=${ATLAS_JOB_WORKERS:2}
atlas.jobs.poll-ms=${ATLAS_JOB_POLL_MS:500}
atlas.jobs.lease-seconds=${ATLAS_JOB_LEASE_SECONDS:900}
atlas.ocr.enabled=false

atlas.tools.http.allowed-hosts=${ATLAS_HTTP_TOOL_HOSTS:}
atlas.tools.http.allow-private=${ATLAS_HTTP_TOOL_ALLOW_PRIVATE:false}
atlas.tools.mcp.allowed-endpoints=${ATLAS_MCP_ENDPOINTS:}
