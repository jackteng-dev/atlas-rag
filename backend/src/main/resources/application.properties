spring.application.name=knowledge-assistant
server.address=127.0.0.1
server.port=18081
server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
server.tomcat.max-http-form-post-size=256KB
knowledge.store=${AKA_STORE:data/store.json}
knowledge.chunk-max-chars=${AKA_CHUNK_MAX_CHARS:800}
knowledge.chunk-strategy=${AKA_CHUNK_STRATEGY:structural}
knowledge.top-k=${AKA_TOP_K:5}
knowledge.coverage-threshold=${AKA_COVERAGE_THRESHOLD:0.60}
knowledge.provider=${AKA_PROVIDER:offline}
knowledge.allow-local-model=${AKA_ALLOW_LOCAL_MODEL:false}
knowledge.ollama-url=${AKA_OLLAMA_URL:http://127.0.0.1:11434}
knowledge.ollama-model=${AKA_OLLAMA_MODEL:}
knowledge.auth-users=${AKA_AUTH_USERS_FILE:}
knowledge.rag.enabled=${AKA_RAG_ENABLED:false}
knowledge.rag.embedding-url=${AKA_EMBEDDING_URL:http://127.0.0.1:18112}
knowledge.rag.reranker-url=${AKA_RERANKER_URL:http://127.0.0.1:18113}
knowledge.rag.llm-url=${AKA_LLM_URL:http://127.0.0.1:18111}
knowledge.rag.llm-model=${AKA_LLM_MODEL:qwen3-4b-instruct-2507}
knowledge.rag.quality-llm-url=${AKA_QUALITY_LLM_URL:}
knowledge.rag.quality-llm-model=${AKA_QUALITY_LLM_MODEL:}
knowledge.rag.qdrant-url=${AKA_QDRANT_URL:http://127.0.0.1:16333}
knowledge.rag.collection=${AKA_QDRANT_COLLECTION:atlas_rag_v1}
knowledge.rag.candidate-k=${AKA_CANDIDATE_K:10}
knowledge.rag.min-rerank-score=${AKA_RERANK_MIN_SCORE:-8.0}
knowledge.rag.max-rerank-gap=${AKA_RERANK_MAX_GAP:5.0}
